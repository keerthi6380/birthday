<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday My Love ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e2de2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 650px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      z-index: 2;
      animation: appear 1.2s ease;
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.8s infinite;
    }

    h1 {
      margin-top: 15px;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      text-shadow: 0 0 15px rgba(255,255,255,.8);
      animation: glow 2s infinite alternate;
    }

    h2 {
      margin-top: 12px;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
    }

    p {
      margin: 20px auto;
      max-width: 500px;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      line-height: 1.7;
    }

    button {
      margin-top: 15px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #e83e8c;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      transition: .3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 60px;
      height: 75px;
      border-radius: 50%;
      opacity: .85;
      animation: float 10s linear infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 100px;
      background: white;
      left: 50%;
      top: 73px;
    }

    .b1 {
      left: 8%;
      background: #ff4757;
      animation-delay: 1s;
    }

    .b2 {
      left: 25%;
      background: #ffd32a;
      animation-delay: 4s;
    }

    .b3 {
      right: 20%;
      background: #1dd1a1;
      animation-delay: 2s;
    }

    .b4 {
      right: 5%;
      background: #54a0ff;
      animation-delay: 6s;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-60vh) rotate(10deg);
      }
      100% {
        transform: translateY(-120vh) rotate(-10deg);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #fff;
      }
      to {
        text-shadow:
          0 0 20px #fff,
          0 0 40px #ffeb3b;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 35px 18px;
        border-radius: 22px;
      }

      .cake {
        font-size: 60px;
      }

      button {
        width: 80%;
        padding: 14px;
      }

      .balloon {
        width: 45px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Birthday Card -->
  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday My Love ❤️</h1>

    <h2>🎉 Wishing You the Most Beautiful Day! 🎉</h2>

    <p>
      Happy Birthday to the most special person in my life. ❤️
      May your day be filled with love, happiness, laughter,
      beautiful memories and everything your heart desires.
      You deserve all the happiness in the world. 💕
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate 🎊
    </button>

  </div>

  <script>
    function createConfetti() {
      const colors = [
        "#ff4757",
        "#ffd32a",
        "#1dd1a1",
        "#54a0ff",
        "#ff6b81",
        "#ffffff",
        "#a55eea"
      ];

      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 8 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {
      createConfetti();

      document.querySelector("h1").innerHTML =
        " Happy Birthday My Love! ❤️";
    }

    window.onload = () => {
      createConfetti();
    };
  </script>

</body>
</html>
